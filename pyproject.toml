[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agentci-v0"
version = "0.2.0"
description = "Evidence-first reliability and sandbox verification for AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "skills/agent-precision/NOTICE.md",
  "skills/capability-routing-reach/NOTICE.md",
]
keywords = [
  "ai-agents",
  "continuous-integration",
  "sandbox-verification",
  "security-testing",
  "reproducible-evidence",
]
dependencies = ["PyYAML>=6.0", "jsonschema[format]>=4.23"]

[project.urls]
Repository = "https://github.com/jinngimk-lang/agentci"
Issues = "https://github.com/jinngimk-lang/agentci/issues"
Documentation = "https://github.com/jinngimk-lang/agentci#readme"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["crawl4ai==0.9.2"]

[project.scripts]
agentci = "agentci.cli:main"

[tool.setuptools]
packages = ["agentci", "agentci.sandbox", "scripts"]
package-dir = {"" = "src", "scripts" = "scripts"}

[tool.setuptools.data-files]
"share/agentci/sandbox/schema" = ["schemas/sandbox-certification-v0alpha1.schema.json"]
"share/agentci/sandbox/receipt-schema" = ["schemas/sandbox-receipt-v0alpha1.schema.json"]
"share/agentci/sandbox/authority-schema" = ["schemas/sandbox-authority-v0alpha1.schema.json"]
"share/agentci/sandbox/testcases" = ["examples/sandbox/testcases/*.json"]
"share/agentci/sandbox/execution-attestations" = ["examples/sandbox/execution-attestations/*.json"]
"share/agentci/sandbox/lifecycle-attestations" = ["examples/sandbox/lifecycle-attestations/*.json"]
"share/agentci/sandbox/runtime-environment-attestations" = ["examples/sandbox/runtime-environment-attestations/*.json"]
"share/agentci/sandbox/receipt-bundles/pass-sensitive-read-denied-001" = ["examples/sandbox/receipt-bundles/pass-sensitive-read-denied-001/*.json"]
"share/agentci/sandbox/receipt-bundles/red-control-sensitive-read-001" = ["examples/sandbox/receipt-bundles/red-control-sensitive-read-001/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
