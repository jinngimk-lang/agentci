[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentci-v0"
version = "0.1.0"
description = "Deterministic reliability checks for AI agent workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["crawl4ai==0.9.2"]

[project.scripts]
agentci = "agentci.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
