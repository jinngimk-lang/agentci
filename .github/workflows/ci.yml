name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Static syntax check
        run: python -m compileall src scripts
      - name: AgentCI sample regression
        run: agentci test examples/evals.yaml --output-dir artifacts
      - name: Invalid growth evidence must be rejected
        run: |
          set +e
          python scripts/validate_growth_artifact.py tests/fixtures/growth/invalid-benchmark
          code=$?
          set -e
          test "$code" -eq 1
      - name: Validate demo growth artifact
        run: python scripts/validate_growth_artifact.py .company/research/findings/demo-benchmark
      - name: Generate draft-only growth pack
        run: python scripts/generate_growth_pack.py .company/research/findings/demo-benchmark --output-root growth
      - name: Clean wheel sandbox smoke
        run: |
          rm -rf /tmp/agentci-wheel /tmp/agentci-venv /tmp/agentci-smoke
          mkdir -p /tmp/agentci-wheel /tmp/agentci-smoke
          python -m pip wheel . --no-deps -w /tmp/agentci-wheel
          python -m venv --system-site-packages /tmp/agentci-venv
          /tmp/agentci-venv/bin/python -m pip install --no-deps /tmp/agentci-wheel/*.whl
          cd /tmp/agentci-smoke
          /tmp/agentci-venv/bin/agentci sandbox doctor --json > doctor.json
          /tmp/agentci-venv/bin/agentci sandbox verify "$GITHUB_WORKSPACE/examples/sandbox/v0alpha1-red-control-evidence.json" --json --print-digest > verify.json
          /tmp/agentci-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import sys

          doctor = json.load(open('doctor.json', encoding='utf-8'))
          verify = json.load(open('verify.json', encoding='utf-8'))
          lifecycle_sidecar = Path(sys.prefix) / 'share' / 'agentci' / 'sandbox' / 'lifecycle-attestations' / 'red-control-sensitive-read-001-11.json'
          assert doctor['state'] in {'ready', 'not-ready'}
          assert verify['valid'] is True
          assert verify['recorded_verdict'] == verify['expected_verdict'] == 'FAIL'
          assert verify['certification_claim'] is False
          assert verify['artifact_digest'].startswith('sha256:')
          assert lifecycle_sidecar.is_file()
          PY
